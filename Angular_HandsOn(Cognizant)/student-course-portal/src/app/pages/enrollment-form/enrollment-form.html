<h2>
Student Enrollment Request
</h2>


<form 
#enrollForm="ngForm"
(ngSubmit)="onSubmit(enrollForm)">


<label>
Student Name:
</label>

<input 
type="text"
name="studentName"
[(ngModel)]="studentName"
required
minlength="3"
#nameCtrl="ngModel">


<div *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">

Name is required

</div>


<div *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">

Name must be at least 3 characters

</div>



<br>


<label>
Student Email:
</label>

<input
type="email"
name="studentEmail"
[(ngModel)]="studentEmail"
required
email
#emailCtrl="ngModel">


<div *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">

Email is required

</div>


<div *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">

Enter valid email

</div>


<br>



<label>
Course ID:
</label>


<input
type="number"
name="courseId"
[(ngModel)]="courseId"
required
#courseCtrl="ngModel">


<div *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']">

Course ID is required

</div>



<br>



<label>
Preferred Semester:
</label>


<select
name="preferredSemester"
[(ngModel)]="preferredSemester"
required>


<option value="">
Select Semester
</option>


<option>
Odd
</option>


<option>
Even
</option>


</select>


<br>



<label>

<input
type="checkbox"
name="agreeToTerms"
[(ngModel)]="agreeToTerms"
required>

I agree to terms

</label>


<br>


<button 
type="submit"
[disabled]="enrollForm.invalid">

Submit

</button>


<button 
type="button"
(click)="enrollForm.resetForm()">

Reset

</button>



</form>



<div *ngIf="submitted">

<h3>
Enrollment request submitted successfully!
</h3>

</div>
